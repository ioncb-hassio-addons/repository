name: Retro Web
version: 0.0.2
slug: retro-web
description: Profile-based retro game library with server-side saves
url: https://github.com/ioncb-hassio-addons/app-retro-web
init: false
ingress: true
panel_icon: mdi:gamepad-variant
panel_title: Retro Web
arch:
- aarch64
- amd64
ports:
  8098/tcp: null
ports_description:
  8098/tcp: Optional external web access
map:
- type: ssl
  read_only: true
options:
  log_level: info
  external_access: false
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  tls_self_signed_days: 365
  tls_self_signed_common_name: ''
  external_username: ''
  external_password: ''
  allow_external_rom_upload: false
  external_admin_password: ''
  session_timeout_hours: 12
  max_upload_mb: 4096
  profile_limit: 8
  enable_arcade: true
  rom_index_interval_minutes: 60
  enable_cover_indexing: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  external_access: bool
  ssl: bool
  certfile: str
  keyfile: str
  tls_self_signed_days: int(1,3650)
  tls_self_signed_common_name: str
  external_username: str
  external_password: password
  allow_external_rom_upload: bool
  external_admin_password: password
  session_timeout_hours: int(1,168)
  max_upload_mb: int(16,16384)
  profile_limit: int(1,20)
  enable_arcade: bool
  rom_index_interval_minutes: int(1,1440)
  enable_cover_indexing: bool
image: ghcr.io/ioncb-hassio-addons/retro-web
